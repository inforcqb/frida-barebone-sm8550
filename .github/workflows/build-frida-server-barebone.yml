name: build-frida-server-barebone

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      FRIDA_PREFIX: /tmp/frida-dist

    steps:
      - name: Check out frida monorepo (17.17.0)
        run: |
          git clone --depth 1 --branch 17.17.0 https://github.com/frida/frida.git .
          git config --global --add safe.directory "$PWD"

      - name: Fetch submodules (releng + frida-core + frida-gum)
        run: |
          python tools/ensure-submodules.py frida-core frida-gum
          for p in subprojects/frida-core subprojects/frida-gum; do
            if [ -d "$p" ]; then
              (cd "$p" && git submodule update --init --depth 1 releng 2>/dev/null || true)
            fi
          done

      - name: Set up NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          add-to-path: false

      - name: Configure (arm64 + barebone backend)
        run: |
          export ANDROID_NDK_ROOT="${{ steps.ndk.outputs.ndk-path }}"
          ./configure \
            --prefix="$FRIDA_PREFIX" \
            --host=android-arm64 \
            --enable-server \
            -- \
            -Dfrida-core:barebone_backend=enabled \
            -Dfrida-core:compiler_backend=disabled

      - name: Compile
        run: make 2>&1 | tail -100

      - name: Install
        run: make install

      - name: Upload frida-server
        uses: actions/upload-artifact@v4
        with:
          name: frida-server-android-arm64-barebone
          path: ${{ env.FRIDA_PREFIX }}/bin/frida-server
          if-no-files-found: error
